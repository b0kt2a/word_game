<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WORD GAME</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="player-page">
  <main class="player-wrap">
    <header class="player-header">
      <div>
        <h1 class="player-logo">WORD GAME</h1>
        <div class="player-subtitle">방핑 개인전</div>
      </div>
      <div id="people" class="people-count">0명 접속</div>
    </header>

    <section id="joinCard" class="player-card join-card">
      <h2>닉네임으로 입장</h2>
      <div class="join-row">
        <input id="nickname" maxlength="20" placeholder="닉네임" autocomplete="off">
        <button id="joinBtn" class="btn">입장</button>
      </div>
    </section>

    <section id="gameCard" class="player-card game-card hidden">
      <div class="game-top">
        <div>
          <h2 id="qTitle">대기 중</h2>
          <div id="meta" class="game-meta"></div>
        </div>
      </div>

      <div id="board" class="board" role="button" tabindex="0" aria-label="정답 입력"></div>
      <div class="legend">
        <span><i class="dot correct"></i>자리일치</span>
        <span><i class="dot present"></i>다른자리</span>
        <span><i class="dot absent"></i>없음</span>
      </div>

      <div id="hints" class="hints"></div>

      <div class="player-actions">
        <button id="hintBtn" class="btn secondary">💡 힌트 보기</button>
        <button id="submitBtn" class="btn">입력 완료</button>
      </div>

      <input
        id="word"
        class="hidden-word-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="정답 입력"
      >

      <div id="status" class="status-line"></div>

      <div id="answerReveal" class="answer-reveal hidden">
        <div class="answer-label">정답</div>
        <div id="revealedAnswer" class="answer-value"></div>
      </div>

      <button
        id="changeNicknameBtn"
        class="btn secondary"
        type="button"
        style="margin-top:8px;min-height:36px;font-size:12px;width:100%;"
      >다른 닉네임으로 입장</button>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
