<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">

    <!-- 빔프로젝터 / PC 화면 크기에 맞게 표시 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 브라우저 탭 제목 -->
    <title>실시간 결과</title>

    <!-- 전체 공통 CSS -->
    <link rel="stylesheet" href="/style.css">


    <!-- ==========================================
         스크린 화면 전용 디자인
    =========================================== -->
    <style>

        /* 전체 화면 */
        body {
            background: #111116;
            color: #fff;
        }

        .wrap {
            max-width: 1600px;
        }

        /* 카드 */
        .card {
            background: #19191f;
            border-color: #33313d;
        }

        /* 보조 글씨 */
        .muted {
            color: #aaa;
        }

        /* 정답자 순위 */
        .winner {
            font-size: clamp(20px, 2.2vw, 38px);
            border-color: #333;
        }

        /* 상태 표시 */
        .pill {
            background: #2b2440;
            color: #d8c9ff;
        }


        /* ==========================================
             QR 대기 화면
        =========================================== */

        #waitingScreen {
            text-align: center;
        }

        /* 대기 화면 제목 */
        .waiting-title {
            font-size: clamp(42px, 5vw, 80px);
            margin-top: 30px;
            margin-bottom: 10px;
        }

        /* "QR을 스캔해서..." 안내 */
        .waiting-message {
            font-size: clamp(22px, 2vw, 34px);
            margin-top: 15px;
            color: #ccc;
        }

        /* QR 전체 영역 */
        .qr-area {
            display: flex;
            justify-content: center;
            margin: 35px 0 25px;
        }

        /* QR 흰색 카드 */
        .qr-box {
            background: #fff;
            padding: 22px;
            border-radius: 22px;
            display: inline-block;
        }

        /* QR 아래 주소 */
        .join-url {
            font-size: clamp(18px, 1.5vw, 26px);
            color: #aaa;
            margin-top: 15px;
        }

        /* 참가자 숫자 */
        .waiting-people {
            margin-top: 35px;
            font-size: clamp(26px, 3vw, 46px);
        }

        /* 참가자 숫자 자체 */
        #waitingPc {
            font-size: 1.5em;
            font-weight: 900;
            color: #fff;
        }


        /* ==========================================
             실제 게임 화면
        =========================================== */

        #gameScreen {
            display: block;
        }

    </style>
</head>


<body>

    <main class="wrap">


        <!-- ==================================================
             1. 게임 시작 전 QR 대기 화면

             운영자가 문제를 시작하기 전까지 표시됨.
             문제 시작 → 자동으로 사라짐.
        =================================================== -->
        <section
            id="waitingScreen"
            class="card"
        >

            <!-- 상단 팀 이름 -->
            <h1>
                TEAM. BANG PING · WORD GAME
            </h1>


            <!-- 메인 안내 -->
            <div class="waiting-title">
                게임에 참가해 주세요!
            </div>


            <div class="waiting-message">
                QR 코드를 스캔하고 닉네임을 입력해 주세요
            </div>


            <!-- ================================
                 QR CODE
            ================================= -->
            <div class="qr-area">

                <div class="qr-box">

                    <!--
                        QRCode.js가
                        이 안에 QR을 자동으로 생성함
                    -->
                    <div id="qrcode"></div>

                </div>

            </div>


            <!-- QR이 안 찍힐 경우 직접 입력할 주소 -->
            <div class="join-url">
                word-game-xrte.onrender.com
            </div>


            <!-- ================================
                 현재 참가자 수

                 참가자가 들어올 때마다
                 screen.js에서 실시간 변경
            ================================= -->
            <div class="waiting-people">

                현재 참가자

                <span id="waitingPc">
                    0
                </span>

                명

            </div>


            <div
                class="muted"
                style="margin-top:20px"
            >
                참가자가 모두 들어오면 게임을 시작합니다
            </div>

        </section>



        <!-- ==================================================
             2. 실제 게임 화면

             대기 중에는 숨겨짐.
             운영자가 문제 시작 → 자동으로 표시됨.
        =================================================== -->
        <div
            id="gameScreen"
            class="hidden"
        >


            <!-- ==========================================
                 현재 게임 상태
            =========================================== -->
            <section class="card">

                <div class="top">


                    <div>

                        <!-- 고정 제목 -->
                        <h1>
                            TEAM. BANG PING · WORD GAME
                        </h1>


                        <!-- 현재 문제 -->
                        <div
                            id="q"
                            class="big"
                        >
                            게임을 준비하고 있어요
                        </div>


                        <!-- 문제 추가 정보 -->
                        <div
                            id="meta"
                            class="muted"
                        ></div>

                    </div>


                    <!-- 게임 상태 -->
                    <div
                        id="phase"
                        class="pill"
                    >
                        대기 중
                    </div>

                </div>


                <!-- 정답자 / 전체 참가자 -->
                <div
                    class="big"
                    style="margin-top:20px"
                >

                    정답자

                    <span id="wc">
                        0
                    </span>

                    /

                    <span id="pc">
                        0
                    </span>

                    명

                </div>

            </section>



            <!-- ==========================================
                 실시간 정답 순위
            =========================================== -->
            <section class="card">

                <h2>
                    🏆 실시간 정답 순위
                </h2>

                <div id="winners"></div>

            </section>



            <!-- ==========================================
                 정답 공개 영역

                 운영자가 정답 공개를 눌렀을 때만 표시
            =========================================== -->
            <section
                id="answerCard"
                class="card hidden"
            >

                <h2>
                    정답
                </h2>

                <div
                    id="answer"
                    class="big"
                ></div>

            </section>


        </div>



        <!-- ==========================================
             Socket.IO
        =========================================== -->
        <script src="/socket.io/socket.io.js"></script>


        <!-- ==========================================
             QR 코드 생성 라이브러리
        =========================================== -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
        </script>


        <!-- ==========================================
             스크린 기능
        =========================================== -->
        <script src="/screen.js"></script>


    </main>

</body>

</html>
