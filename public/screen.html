<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방핑 단어게임 실시간 화면</title>
<style>
:root{--bg:#0f0f12;--panel:#18181d;--panel2:#23232a;--line:#34343d;--text:#f8f7fc;--muted:#aaa8b5;--accent:#b69cff;--gold:#f3d76d;--silver:#d5d5dd;--bronze:#c89568}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 0%,rgba(182,156,255,.18),transparent 35%),var(--bg);color:var(--text);overflow:hidden}.screen{min-height:100vh;padding:4vh 4vw;display:grid;grid-template-rows:auto auto 1fr;gap:2.2vh}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:2vw}.brand{font-size:clamp(18px,2vw,34px);font-weight:900;letter-spacing:.08em;color:#dcd3ff}.status{padding:.7em 1.1em;border-radius:999px;background:#24212d;border:1px solid #3a3447;font-size:clamp(14px,1.4vw,24px);font-weight:800;color:#ded5ff}.hero{text-align:center}.question{margin:0;font-size:clamp(44px,6vw,94px);line-height:1;letter-spacing:-.04em}.sub{margin-top:1.1vh;color:var(--muted);font-size:clamp(18px,1.7vw,30px)}.count{margin-top:1.5vh;font-size:clamp(34px,4vw,66px);font-weight:1000}.count strong{color:var(--accent)}.content{min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:2vw}.panel{min-height:0;background:rgba(24,24,29,.96);border:1px solid var(--line);border-radius:28px;padding:2.2vh 2vw;box-shadow:0 18px 50px rgba(0,0,0,.26)}.panel-title{font-size:clamp(22px,2vw,34px);font-weight:900;margin-bottom:1.4vh}.winners{height:calc(100% - 3.5vh);overflow:hidden;display:grid;align-content:start;gap:1vh}.winner{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:1vw;padding:1.2vh 1.2vw;border-radius:18px;background:var(--panel2);border:1px solid #33333d;font-size:clamp(18px,1.6vw,28px)}.rank{font-weight:1000;text-align:center;font-size:clamp(22px,1.8vw,34px)}.winner:nth-child(1) .rank{color:var(--gold)}.winner:nth-child(2) .rank{color:var(--silver)}.winner:nth-child(3) .rank{color:var(--bronze)}.name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:.82em;white-space:nowrap}.side{display:grid;grid-template-rows:auto 1fr;gap:1.6vh;min-height:0}.statbox{background:var(--panel2);border:1px solid #33333d;border-radius:22px;padding:1.8vh 1.4vw;text-align:center}.statbox .label{color:var(--muted);font-size:clamp(15px,1.3vw,22px)}.statbox .value{margin-top:.3vh;font-size:clamp(34px,4vw,64px);font-weight:1000}.message{display:grid;place-items:center;text-align:center;height:100%;padding:2vh}.message .big{font-size:clamp(34px,4vw,68px);font-weight:1000;line-height:1.15}.answer{margin-top:1.8vh;padding:1.5vh 1.4vw;border-radius:20px;background:#2a2433;color:#e9e1ff;font-size:clamp(32px,4vw,64px);font-weight:1000;line-height:1.2;word-break:keep-all}.hidden{display:none!important}@media(max-aspect-ratio:4/3){.content{grid-template-columns:1fr;grid-template-rows:1fr auto}.side{grid-template-columns:repeat(2,1fr);grid-template-rows:none}}
</style>
</head>
<body>
<main class="screen">
<div class="top"><div class="brand">TEAM. BANG PING · WORD GAME</div><div id="phaseBadge" class="status">대기 중</div></div>
<section class="hero"><h1 id="questionText" class="question">게임을 준비하고 있어요</h1><div id="questionSub" class="sub">참가자들의 접속을 기다리는 중</div><div class="count">정답자 <strong id="winnerCount">0</strong> / <span id="participantCount">0</span>명</div></section>
<section class="content">
<div class="panel"><div class="panel-title">🏆 실시간 정답 순위</div><div id="winnerList" class="winners"></div></div>
<div class="side"><div class="statbox"><div class="label">현재 참가자</div><div id="participantBig" class="value">0명</div></div><div class="panel"><div id="messageBox" class="message"><div><div id="messageBig" class="big">잠시만 기다려 주세요</div><div id="messageSub" class="sub">운영자가 문제를 시작하면 자동으로 바뀝니다.</div><div id="answerBox" class="answer hidden"></div></div></div></div></div>
</section></main>
<script src="/socket.io/socket.io.js"></script><script src="/screen.js"></script>
</body></html>
