<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실시간 결과</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="screen-page">
  <main class="screen-wrap">

    <!-- 게임 최초 시작 전만 보이는 QR 대기 화면 -->
    <section id="waitingScreen" class="screen-waiting">
      <div class="screen-brand">TEAM. BANG PING · WORD GAME</div>
      <h1 class="screen-waiting-title">게임에 참가해 주세요</h1>
      <p class="screen-waiting-sub">QR 코드를 스캔하고 닉네임을 입력해 주세요</p>

      <div class="qr-shell">
        <div id="qrcode"></div>
      </div>

      <div class="screen-url">word-game-xrte.onrender.com</div>
      <div class="waiting-count">현재 참가자 <strong id="waitingPc">0</strong>명</div>
    </section>

    <!-- 첫 문제 시작 이후 사용하는 대시보드 화면 -->
    <section id="gameScreen" class="screen-game hidden">
      <div class="screen-topbar">
        <div class="screen-brand">TEAM. BANG PING · WORD GAME</div>
        <div id="phase" class="screen-phase">대기 중</div>
      </div>

      <!-- 진행 중에는 문제/정답자 수, 정답 공개 시 같은 영역이 정답 화면으로 교체 -->
      <section class="screen-hero">
        <div id="questionHero" class="hero-content">
          <div id="q" class="hero-question">문제 1</div>
          <div id="meta" class="hero-meta"></div>
          <div class="hero-count">정답자 <strong id="wc">0</strong> / <span id="pc">0</span>명</div>
        </div>

        <div id="answerHero" class="hero-content hidden">
          <div class="answer-hero-label">정답</div>
          <div id="answer" class="answer-hero-value"></div>
        </div>
      </section>

      <div class="screen-dashboard">
        <section class="screen-panel current-ranking">
          <h2>🏆 실시간 정답 순위</h2>
          <div id="winners"></div>
        </section>

        <aside class="screen-side">
          <section class="screen-panel participant-panel">
            <div class="side-label">현재 참가자</div>
            <div id="participantBig" class="side-big">0명</div>
          </section>

          <section class="screen-panel cumulative-panel">
            <h2>🏆 누적 종합 순위</h2>
            <div id="cumulative"></div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/screen.js"></script>
</body>
</html>
